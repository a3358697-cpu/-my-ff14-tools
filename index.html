<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#080607;
    --bg-void-2:#0e0a0b;
    --bg-panel:#151010;
    --bg-panel-2:#1c1515;
    --border-soft:#54453a;
    --text-parchment:#e8ddd0;
    --text-muted:#a4917f;
    --text-dim:#6b5c4d;
    --accent-gold:#c3a679;
    --accent-gold-soft:#87715a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle, rgba(195,166,121,0.05) 1px, transparent 1.5px) 0 0/28px 28px,
      radial-gradient(circle at 15% 0%, rgba(195,166,121,0.045), transparent 45%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    color:var(--text-parchment);
    font-family:'Noto Sans TC','Noto Serif TC',serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{max-width:980px;margin:0 auto;padding:60px 20px 80px;}
  h1{
    font-family:'Cinzel','Noto Serif TC',serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.08em;
    text-align:center;
    margin:0 0 8px;
  }
  p.sub{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    margin:0 0 44px;
    letter-spacing:0.05em;
  }
  .categories{display:grid;grid-template-columns:repeat(3, 1fr);gap:22px;align-items:start;}
  @media (max-width:760px){.categories{grid-template-columns:1fr;}}
  .category{display:flex;flex-direction:column;gap:12px;}
  .category-title{
    font-family:'Noto Serif TC',serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--accent-gold);
    text-align:center;
    letter-spacing:0.1em;
    margin:0 0 2px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border-soft);
  }
  a.tool-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:16px 16px;
    text-decoration:none;
    color:var(--text-parchment);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.tool-card:hover{border-color:var(--accent-gold-soft);transform:translateY(-2px);}
  .tool-icon{
    width:34px;height:34px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--accent-gold);
    border:1px solid var(--border-soft);
    border-radius:9px;
  }
  .tool-name{font-family:'Noto Serif TC',serif;font-size:15.5px;font-weight:600;margin:0 0 3px;}
  .tool-desc{font-size:12px;color:var(--text-muted);margin:0;line-height:1.5;}
  .placeholder-card{
    border:1px dashed var(--border-soft);
    border-radius:14px;
    padding:16px 16px;
    text-align:center;
  }
  .placeholder-card .tool-name{color:var(--text-dim);}
  .placeholder-card .tool-desc{color:var(--text-dim);opacity:0.75;}
  .backup-panel{
    margin-top:40px;
    padding-top:28px;
    border-top:1px solid var(--border-soft);
  }
  .backup-panel h2{
    font-family:'Noto Serif TC',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--accent-gold);
  }
  .backup-panel p{
    font-size:13px;
    color:var(--text-muted);
    line-height:1.6;
    margin:0 0 16px;
  }
  .backup-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .backup-btn{
    background:var(--bg-panel-2);
    border:1px solid var(--border-soft);
    color:var(--text-parchment);
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    padding:10px 18px;
    border-radius:9px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .backup-btn:hover{border-color:var(--accent-gold-soft);color:var(--accent-gold);}
  .backup-status{margin-top:12px;font-size:12.5px;color:var(--text-dim);min-height:1.4em;}
  footer{text-align:center;margin-top:40px;font-size:11.5px;color:var(--text-dim);letter-spacing:0.05em;}
</style>
</head>
<body>
<div class="stage">
  <h1>工具箱</h1>
  <p class="sub">你的個人小工具入口</p>
  <div class="categories">
    <div class="category">
      <div class="category-title">日常個人</div>
      <a class="tool-card" href="ff14-tracker.html">
        <div class="tool-icon">◆</div>
        <div>
          <div class="tool-name">乙太紀錄簿</div>
          <p class="tool-desc">每週／每日任務、目標、雜項</p>
        </div>
      </a>
      <a class="tool-card" href="submarine.html">
        <div class="tool-icon">⚓</div>
        <div>
          <div class="tool-name">潛水艇</div>
          <p class="tool-desc">潛水艇時間、路線時間表、點位開圖樹</p>
        </div>
      </a>
    </div>


    <div class="category">
      <div class="category-title">夜酌</div>
      <a class="tool-card" href="salary-tracker.html">
        <div class="tool-icon">￥</div>
        <div>
          <div class="tool-name">接待台帳</div>
          <p class="tool-desc">每日紀錄、預約、自由筆記</p>
        </div>
      </a>
      <a class="tool-card" href="security-log.html">
        <div class="tool-icon">✚</div>
        <div>
          <div class="tool-name">保安紀錄</div>
          <p class="tool-desc">流程、確認事項、人數金額、ID到訪次數</p>
        </div>
      </a>
      <a class="tool-card" href="night-macros.html">
        <div class="tool-icon">✎</div>
        <div>
          <div class="tool-name">巨集/宏</div>
          <p class="tool-desc">保安、接待固定宏，公關範本可自行編輯</p>
        </div>
      </a>
    </div>

    <div class="category">
      <div class="category-title">甜綿菓室</div>
      <a class="tool-card" href="boardgames.html">
        <div class="tool-icon">♣</div>
        <div>
          <div class="tool-name">桌遊</div>
          <p class="tool-desc">各遊戲固定宏參考</p>
        </div>
      </a>
      <div class="placeholder-card">
        <div class="tool-name">巨集/宏</div>
        <p class="tool-desc">即將推出</p>
      </div>
    </div>
  </div>

  <div class="backup-panel">
    <h2>備份與還原</h2>
    <p>以防萬一，建議偶爾下載一份備份存起來。備份檔會包含以上所有工具目前的資料；還原時會蓋掉對應工具目前的內容，請小心操作。</p>
    <div class="backup-actions">
      <button class="backup-btn" id="downloadBackupBtn" type="button">下載備份</button>
      <button class="backup-btn" id="importBackupBtn" type="button">還原備份</button>
      <input type="file" id="importBackupFile" accept=".json" style="display:none;">
    </div>
    <div class="backup-status" id="backupStatus"></div>
  </div>

  <footer>資料存在你目前使用的瀏覽器裡，換裝置或清除瀏覽器資料需另外處理。</footer>
</div>

<script>
(function(){
  // Known storage keys used by each tool in this toolbox.
  const TOOL_KEYS = [
    { label: '乙太紀錄簿', key: 'ff14-tracker-state-v2' },
    { label: '潛水艇', key: 'ff14-submarine-state-v1' },
    { label: '接待台帳', key: 'rp-payroll:state-v2' },
    { label: '保安紀錄', key: 'rp-security:state-v2' },
    { label: '夜酌巨集/宏', key: 'rp-night-macros:state-v1' },
    { label: '桌遊', key: 'rp-boardgames:state-v1' }
  ];

  const hasCloudStorage = !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');

  async function storeGet(key){
    if(hasCloudStorage){
      try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storeSet(key, value){
    if(hasCloudStorage){
      try{ await window.storage.set(key, value, false); return true; }
      catch(e){ return false; }
    }
    try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
  }

  const statusEl = document.getElementById('backupStatus');

  document.getElementById('downloadBackupBtn').addEventListener('click', async () => {
    statusEl.textContent = '正在收集資料…';
    const backup = {};
    for(const tool of TOOL_KEYS){
      const raw = await storeGet(tool.key);
      if(raw !== null && raw !== undefined) backup[tool.key] = raw;
    }
    const foundCount = Object.keys(backup).length;
    if(foundCount === 0){
      statusEl.textContent = '目前偵測不到任何工具的資料，可能都還沒有開始使用。';
      return;
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const dateTag = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = `工具箱備份-${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusEl.textContent = `已下載備份，包含 ${foundCount} 個工具的資料。`;
  });

  document.getElementById('importBackupBtn').addEventListener('click', () => {
    document.getElementById('importBackupFile').click();
  });

  document.getElementById('importBackupFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('格式錯誤');
        const keys = Object.keys(parsed);
        if(!keys.length) throw new Error('備份檔是空的');
        if(!confirm(`這份備份檔包含 ${keys.length} 筆工具資料，還原會覆蓋目前對應工具的內容，確定要還原嗎？`)) return;
        let ok = 0;
        for(const key of keys){
          const success = await storeSet(key, parsed[key]);
          if(success) ok++;
        }
        statusEl.textContent = `已還原 ${ok}／${keys.length} 筆工具資料，重新打開對應工具即可看到還原後的內容。`;
      }catch(err){
        statusEl.textContent = '還原失敗，請確認這是本頁下載的備份檔。';
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  if(!hasCloudStorage){
    statusEl.textContent = '目前是用瀏覽器本機儲存，建議定期下載備份以防資料遺失。';
  }
})();
</script>
</body>
</html>
