<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#080607;
    --bg-void-2:#0e0a0b;
    --bg-panel:#151010;
    --bg-panel-2:#1c1515;
    --border-soft:#54453a;
    --text-parchment:#e8ddd0;
    --text-muted:#a4917f;
    --text-dim:#6b5c4d;
    --accent-gold:#c3a679;
    --accent-gold-soft:#87715a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle, rgba(195,166,121,0.05) 1px, transparent 1.5px) 0 0/28px 28px,
      radial-gradient(circle at 15% 0%, rgba(195,166,121,0.045), transparent 45%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--bg-void-2) 100%);
    color:var(--text-parchment);
    font-family:'Noto Sans TC','Noto Serif TC',serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{max-width:720px;margin:0 auto;padding:60px 20px 80px;}
  h1{
    font-family:'Cinzel','Noto Serif TC',serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.08em;
    text-align:center;
    margin:0 0 8px;
  }
  p.sub{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    margin:0 0 44px;
    letter-spacing:0.05em;
  }
  .grid{display:flex;flex-direction:column;gap:14px;}
  a.tool-card{
    display:flex;
    align-items:center;
    gap:16px;
    background:linear-gradient(160deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:20px 22px;
    text-decoration:none;
    color:var(--text-parchment);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.tool-card:hover{border-color:var(--accent-gold-soft);transform:translateY(-2px);}
  .tool-icon{
    width:40px;height:40px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:var(--accent-gold);
    border:1px solid var(--border-soft);
    border-radius:10px;
  }
  .tool-name{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600;margin:0 0 3px;}
  .tool-desc{font-size:13px;color:var(--text-muted);margin:0;}
  .placeholder{
    border:1px dashed var(--border-soft);
    border-radius:14px;
    padding:20px 22px;
    color:var(--text-dim);
    font-size:13.5px;
    text-align:center;
  }
  footer{text-align:center;margin-top:50px;font-size:11.5px;color:var(--text-dim);letter-spacing:0.05em;}
</style>
</head>
<body>
<div class="stage">
  <h1>工具箱</h1>
  <p class="sub">你的個人小工具入口</p>
  <div class="grid">
    <a class="tool-card" href="ff14-tracker.html">
      <div class="tool-icon">◆</div>
      <div>
        <div class="tool-name">以太紀錄簿 · FF14 Tracker</div>
        <p class="tool-desc">每週／每日任務、潛水艇時間、目標、雜項筆記</p>
      </div>
    </a>
    <div class="placeholder">之後新增的工具會放在這裡</div>
  </div>
  <footer>資料存在你目前使用的瀏覽器裡，換裝置或清除瀏覽器資料需另外處理。</footer>
</div>
</body>
</html>
